<!-- @dsCard group="Colors" viewport="700x150" name="Coral — Primary" subtitle="The brand. Buttons, links, active states, energy." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-sans)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;color:#fff}
  .sw small{font-family:var(--font-mono);font-size:10px;opacity:.95;line-height:1.3}
  .sw b{font-size:11px;font-weight:700}
  .dark{color:var(--ink-900)}
  .cap{margin-top:9px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)}
  .star{position:absolute;margin:-2px 0 0 4px;font-size:10px;color:var(--amber-500)}
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--coral-50)"><b>50</b><small>FFF1ED</small></div>
    <div class="sw dark" style="background:var(--coral-100)"><b>100</b><small>FFE0D5</small></div>
    <div class="sw dark" style="background:var(--coral-200)"><b>200</b><small>FFC2AD</small></div>
    <div class="sw dark" style="background:var(--coral-300)"><b>300</b><small>FF9D80</small></div>
    <div class="sw" style="background:var(--coral-400)"><b>400</b><small>FF7855</small></div>
    <div class="sw" style="background:var(--coral-500)"><b>500 ★</b><small>FF5A3C</small></div>
    <div class="sw" style="background:var(--coral-600)"><b>600</b><small>ED401E</small></div>
    <div class="sw" style="background:var(--coral-700)"><b>700</b><small>C22E13</small></div>
    <div class="sw" style="background:var(--coral-800)"><b>800</b><small>8F2410</small></div>
    <div class="sw" style="background:var(--coral-900)"><b>900</b><small>5C1A0E</small></div>
  </div>
  <div class="cap"><span><b style="color:var(--text-strong)">--primary</b> = coral-500 · hover 600 · press 700</span><span>★ default</span></div>
</body></html>
