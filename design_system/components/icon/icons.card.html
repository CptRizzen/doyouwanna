<!-- @dsCard group="Components" viewport="700x200" name="Icons — Lucide set" subtitle="Lucide line icons, 2px stroke. The app's icon vocabulary." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-card);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(11,1fr);gap:16px 8px}
  .c{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text-strong)}
  .c span{font-size:9.5px;color:var(--text-subtle);font-family:var(--font-mono)}
  .note{font-size:11px;color:var(--text-muted);margin-bottom:16px}
  .note b{color:var(--text-strong)}
</style>
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="note">System: <b>Lucide</b> · 2px stroke, round caps. Tabs use filled-weight via stroke 2.6. <b>Substitution flag:</b> closest CDN match to an SF-Symbols feel — swap if you license a custom set.</div>
<div class="grid" id="g"></div>
<script>
  const names=['house','users-round','map','user-round','plus','bell','search','sliders-horizontal','map-pin','navigation','calendar','clock','check','x','chevron-right','heart','share-2','radar','shield-alert','circle-help','message-circle','sparkles','star','camera','settings','user-plus','flag','eye','eye-off','lock','compass','tent','beer','coffee','mountain-snow','footprints','ticket','qr-code','image','send','arrow-left','more-horizontal','circle-check','locate-fixed','hand'];
  const g=document.getElementById('g');
  names.forEach(n=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<i data-lucide="${n}" style="width:24px;height:24px"></i><span>${n}</span>`;g.appendChild(d);});
  lucide.createIcons({attrs:{'stroke-width':2}});
</script>
</body></html>
