// Shared UI-kit helpers (not core components) — headers, section labels, sheets.
const DS = window.DoYouWannaDesignSystem_3f6d35;

// Large screen header with title + optional action buttons on the right.
function ScreenHeader({ title, subtitle, eyebrow, right, onBack, pad = 20 }) {
  const { IconButton } = DS;
  return (
    <div style={{ padding: `54px ${pad}px 10px`, background: 'var(--surface-page)', flex: 'none' }}>
      {onBack && (
        <div style={{ marginBottom: 8, marginLeft: -8 }}>
          <IconButton icon="arrow-left" tone="soft" size={40} onClick={onBack} label="Back" />
        </div>
      )}
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 12 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          {eyebrow && <div className="dyw-eyebrow" style={{ marginBottom: 4 }}>{eyebrow}</div>}
          <h1 style={{ fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 30, lineHeight: 1.05, color: 'var(--text-strong)', letterSpacing: '-0.02em' }}>{title}</h1>
          {subtitle && <div style={{ fontSize: 14, color: 'var(--text-muted)', marginTop: 5, fontWeight: 500 }}>{subtitle}</div>}
        </div>
        {right && <div style={{ display: 'flex', gap: 8, flex: 'none' }}>{right}</div>}
      </div>
    </div>
  );
}

function SectionLabel({ children, action, onAction }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', margin: '4px 0 12px' }}>
      <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 700, fontSize: 17, color: 'var(--text-strong)', letterSpacing: '-0.01em', whiteSpace: 'nowrap' }}>{children}</span>
      {action && <span onClick={onAction} style={{ fontSize: 13.5, fontWeight: 700, color: 'var(--primary)', cursor: 'pointer' }}>{action}</span>}
    </div>
  );
}

// Scrollable screen body with consistent gutter + bottom space for the tab bar.
function ScreenBody({ children, pad = 20, bottom = 96, style = {} }) {
  return (
    <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', WebkitOverflowScrolling: 'touch', padding: `4px ${pad}px ${bottom}px`, ...style }}>
      {children}
    </div>
  );
}

// A privacy reassurance strip — load-bearing for the brand.
function PrivacyNote({ children, tone = 'neutral' }) {
  const { Icon } = DS;
  const c = tone === 'good' ? 'var(--success)' : 'var(--text-muted)';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '11px 13px', background: 'var(--surface-sunken)', borderRadius: 'var(--radius-md)', color: c }}>

    </div>
  );
}

// Circles screens — the hero flow.
const DS_c = window.DoYouWannaDesignSystem_3f6d35;

function CircleRow({ circle, onOpen }) {
  const { Card, Avatar, AvatarStack, Badge, Icon } = DS_c;
  const { plansForCircle } = window.DYW_DATA;
  const next = plansForCircle(circle.id)[0];
  const isLive = circle.live && circle.live.length > 0;
  return (
    <Card pressable padding={0} onClick={() => onOpen(circle.id)} style={{ overflow: 'hidden' }}>
      <div style={{ display: 'flex', gap: 13, padding: 14, alignItems: 'center' }}>
        <div style={{ width: 52, height: 52, borderRadius: 'var(--radius-lg)', flex: 'none', display: 'grid', placeItems: 'center', background: `color-mix(in srgb, ${circle.color} 16%, white)`, color: circle.color }}>

            {isLive && <Badge tone="live" dot size="sm">Live</Badge>}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
            <AvatarStack people={circle.members} size={24} max={4} total={circle.members.length} />

          </div>
        </div>
        <Icon name="chevron-right" size={20} color="var(--text-subtle)" strokeWidth={2.4} />
      </div>
      {next && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '11px 16px', borderTop: '1px solid var(--divider)', background: 'var(--surface-sunken)' }}>

            Next · {next.title}
          </span>
          <span style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 700, flex: 'none' }}>{next.when}</span>
        </div>

}

function CirclesScreen({ onOpenCircle, onNotifications }) {
  const { IconButton, Icon } = DS_c;
  const { ScreenHeader, ScreenBody } = window.DYW_UI;
  const { CIRCLES } = window.DYW_DATA;
  const friends = new Set();
  CIRCLES.forEach((c) => c.members.forEach((m) => friends.add(m.id)));
  return (
    <>
      <ScreenHeader
        eyebrow="DO YOU WANNA"
        title="Your circles"
        subtitle={`${CIRCLES.length} circles · ${friends.size - 1} friends`}
        right={<>
          <IconButton icon="search" tone="soft" />
          <IconButton icon="bell" tone="soft" onClick={onNotifications} />
        </>}
      />
      <ScreenBody>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
          {CIRCLES.map((c) => <CircleRow key={c.id} circle={c} onOpen={onOpenCircle} />)}
          <button onClick={() => onOpenCircle(CIRCLES[0].id)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9, height: 56, borderRadius: 'var(--radius-xl)', border: '2px dashed var(--border-default)', background: 'transparent', color: 'var(--text-muted)', cursor: 'pointer', fontFamily: 'var(--font-sans)', fontWeight: 700, fontSize: 15 }}>
            <Icon name="plus" size={20} strokeWidth={2.4} /> New circle

        </div>
      </ScreenBody>
    </>
  );
}

        <div style={{ display: 'flex', justifyContent: 'space-between', marginLeft: -8 }}>
          <IconButton icon="arrow-left" tone="glass" size={40} onClick={onBack} label="Back" />

        <div style={{ display: 'flex', alignItems: 'center', gap: 13, marginTop: 14 }}>

            <Icon name="user-plus" size={16} strokeWidth={2.4} /> Invite

              onClick={() => onOpenPlan(plans[0].id)} />

          {plans.slice(1).map((p) => (
            <EventCard key={p.id} layout="row" image={p.img} title={p.title} time={p.when}

// ── Shell ─────────────────────────────────────────────────────
function AppShell() {
  const { TabBar } = DS_a;
  const { IOSDevice } = window;
  const { CirclesScreen, CircleDetailScreen } = window.DYW_Circles;
  const { PlanDetailScreen, MapScreen, ProfileScreen } = window.DYW_Screens;
  const { useState } = React;

  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // [{type, id}]
  const [sheet, setSheet] = useState(false);

  const push = (v) => setStack((s) => [...s, v]);
  const pop = () => setStack((s) => s.slice(0, -1));
  const top = stack[stack.length - 1];

  const openCircle = (id) => push({ type: 'circle', id });
  const openPlan = (id) => push({ type: 'plan', id });
  const goMap = () => { setStack([]); setTab('map'); };

  const onTab = (k) => {
    if (k === 'create') { setSheet(true); return; }
    setStack([]); setTab(k);
  };

  let screen;
  if (top?.type === 'circle') {
    screen = <CircleDetailScreen circleId={top.id} onBack={pop} onOpenPlan={openPlan} onBroadcast={() => setSheet(true)} onMap={goMap} />;
  } else if (top?.type === 'plan') {
    screen = <PlanDetailScreen planId={top.id} onBack={pop} onMap={goMap} />;
  } else if (tab === 'home') {
    screen = <HomeScreen onOpenPlan={openPlan} onMap={goMap} onNotifications={() => {}} />;
  } else if (tab === 'circles') {
    screen = <CirclesScreen onOpenCircle={openCircle} onNotifications={() => {}} />;
  } else if (tab === 'map') {
    screen = <MapScreen onBack={() => onTab('home')} onOpenPlan={openPlan} />;
  } else {
    screen = <ProfileScreen />;
  }

  const showTabBar = !top; // hide on pushed detail screens
  const items = [
    { key: 'home', icon: 'house', label: 'Home' },
    { key: 'circles', icon: 'users-round', label: 'Circles', badge: 2 },
    { key: 'create', icon: 'plus', label: 'Plan' },
    { key: 'map', icon: 'map', label: 'Nearby' },
    { key: 'me', icon: 'user-round', label: 'You' },
  ];

  return (
    <IOSDevice>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative', background: 'var(--surface-page)' }}>
        <div style={{ position: 'relative', flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', background: 'var(--surface-page)' }}>
          {screen}
        </div>
        {showTabBar && <TabBar active={tab} onChange={onTab} items={items} />}
        <CreateSheet open={sheet} onClose={() => setSheet(false)} />
      </div>
    </IOSDevice>
  );
}
