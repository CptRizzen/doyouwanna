<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Generous & bubbly. Cards 24, sheets 28, pills full." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 22px;background:var(--surface-card);font-family:var(--font-sans);display:flex;gap:16px;align-items:flex-end}
  .c{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sq{width:74px;height:74px;background:var(--coral-100);border:1.5px solid var(--coral-300)}
  .nm{font-size:11px;font-weight:700;color:var(--text-strong)}
  .tok{font-family:var(--font-mono);font-size:9px;color:var(--text-subtle)}
  .pill{width:96px;height:46px;border-radius:var(--radius-pill);background:var(--coral-100);border:1.5px solid var(--coral-300)}
</style></head>
<body>
  <div class="c"><div class="sq" style="border-radius:var(--radius-sm)"></div><span class="nm">10</span><span class="tok">sm</span></div>
  <div class="c"><div class="sq" style="border-radius:var(--radius-md)"></div><span class="nm">14</span><span class="tok">md</span></div>
  <div class="c"><div class="sq" style="border-radius:var(--radius-lg)"></div><span class="nm">18</span><span class="tok">lg</span></div>
  <div class="c"><div class="sq" style="border-radius:var(--radius-xl)"></div><span class="nm">24</span><span class="tok">xl · card</span></div>
  <div class="c"><div class="sq" style="border-radius:var(--radius-2xl)"></div><span class="nm">30</span><span class="tok">2xl</span></div>
  <div class="c"><div class="sq" style="border-radius:var(--radius-3xl)"></div><span class="nm">40</span><span class="tok">3xl</span></div>
  <div class="c"><div class="pill"></div><span class="nm">pill</span><span class="tok">999 · buttons</span></div>
</body></html>
