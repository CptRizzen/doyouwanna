<!-- @dsCard group="Type" viewport="700x150" name="DM Mono + roles" subtitle="Invite codes, timestamps, distances. Plus eyebrow style." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 22px;background:var(--surface-card);font-family:var(--font-sans);display:flex;gap:28px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mono{font-family:var(--font-mono);color:var(--text-strong)}
  .code{font-size:22px;letter-spacing:.12em;font-weight:500}
  .small{font-size:13px;color:var(--text-muted)}
  .pill{font-family:var(--font-mono);font-size:12px;background:var(--ink-100);color:var(--text-body);padding:5px 10px;border-radius:var(--radius-pill);display:inline-block}
  .eye{font-family:var(--font-sans);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
  .div{width:1px;align-self:stretch;background:var(--divider)}
  .lab{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono);margin-top:2px}
</style></head>
<body>
  <div class="col">
    <div class="code mono">WANNA-7F3K</div>
    <div class="lab">invite code · DM Mono</div>
    <div style="display:flex;gap:8px"><span class="pill">2.4 km</span><span class="pill">6:30 PM</span><span class="pill">+4 going</span></div>
  </div>
  <div class="div"></div>
  <div class="col">
    <div class="eye">Nearby right now</div>
    <div class="eye" style="color:var(--primary)">Live · sharing</div>
    <div class="lab">--role-eyebrow · 700 · uppercase · tracking 0.08em</div>
  </div>
</body></html>
