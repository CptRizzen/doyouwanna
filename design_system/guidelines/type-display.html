<!-- @dsCard group="Type" viewport="700x180" name="Fredoka — Display" subtitle="Rounded & bubbly. Wordmark, headings, big moments." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 22px;background:var(--surface-card)}
  .big{font-family:var(--font-display);font-weight:600;color:var(--text-strong);letter-spacing:-.02em;line-height:1.05;font-size:46px}
  .mid{font-family:var(--font-display);font-weight:500;color:var(--text-body);font-size:26px;margin-top:6px}
  .meta{margin-top:14px;display:flex;gap:18px;font-family:var(--font-sans);font-size:11px;color:var(--text-muted)}
  .meta b{color:var(--text-strong)}
  .w{display:flex;gap:14px;margin-top:10px;align-items:baseline}
  .w span{font-family:var(--font-display);font-size:22px;color:var(--text-strong)}
</style></head>
<body>
  <div class="big">Do you wanna go?</div>
  <div class="mid">Hiking crew · Friday 6pm</div>
  <div class="w">
    <span style="font-weight:400">400</span>
    <span style="font-weight:500">500</span>
    <span style="font-weight:600">600</span>
    <span style="font-weight:700">700</span>
  </div>
  <div class="meta"><span><b>--font-display</b> · Fredoka</span><span>Tracking <b>-0.02em</b> at display sizes</span><span>Use 500–600 for UI headings</span></div>
</body></html>
