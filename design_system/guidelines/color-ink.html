<!-- @dsCard group="Colors" viewport="700x150" name="Ink — Warm neutrals" subtitle="Text + surfaces. Warm-tinted, never pure gray or black." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-sans)}
  .row{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-subtle)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px}
  .sw small{font-family:var(--font-mono);font-size:9.5px;opacity:.95;line-height:1.3}
  .sw b{font-size:11px;font-weight:700}
  .dark{color:var(--ink-900)}.light{color:#fff}
  .cap{margin-top:9px;font-size:11px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--ink-900)"><b>900</b><small>17140F</small></div>
    <div class="sw light" style="background:var(--ink-800)"><b>800</b><small>241F18</small></div>
    <div class="sw light" style="background:var(--ink-700)"><b>700</b><small>3A332A</small></div>
    <div class="sw light" style="background:var(--ink-600)"><b>600</b><small>564E42</small></div>
    <div class="sw light" style="background:var(--ink-500)"><b>500</b><small>79705F</small></div>
    <div class="sw dark" style="background:var(--ink-400)"><b>400</b><small>A99E8C</small></div>
    <div class="sw dark" style="background:var(--ink-300)"><b>300</b><small>D2C9BA</small></div>
    <div class="sw dark" style="background:var(--ink-200)"><b>200</b><small>E7E0D5</small></div>
    <div class="sw dark" style="background:var(--ink-100)"><b>100</b><small>F2ECE2</small></div>
    <div class="sw dark" style="background:var(--paper)"><b>paper</b><small>FFFBF5</small></div>
  </div>
  <div class="cap"><b style="color:var(--text-strong)">text</b> 900/800/500/400 · <b style="color:var(--text-strong)">surfaces</b> paper page · white card · ink-900 dark mode</div>
</body></html>
