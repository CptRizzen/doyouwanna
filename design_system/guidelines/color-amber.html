<!-- @dsCard group="Colors" viewport="700x150" name="Amber — Accent" subtitle="Energy + highlights. Sparks, badges, RSVP yes, sun." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-sans)}
  .row{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px}
  .sw small{font-family:var(--font-mono);font-size:10px;opacity:.95;line-height:1.3}
  .sw b{font-size:11px;font-weight:700}
  .dark{color:var(--ink-900)}.light{color:#fff}
  .cap{margin-top:9px;font-size:11px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--amber-50)"><b>50</b><small>FFF8E8</small></div>
    <div class="sw dark" style="background:var(--amber-100)"><b>100</b><small>FFEFC4</small></div>
    <div class="sw dark" style="background:var(--amber-200)"><b>200</b><small>FFE08A</small></div>
    <div class="sw dark" style="background:var(--amber-300)"><b>300</b><small>FFD04D</small></div>
    <div class="sw dark" style="background:var(--amber-400)"><b>400 ★</b><small>FFC23C</small></div>
    <div class="sw dark" style="background:var(--amber-500)"><b>500</b><small>F5A800</small></div>
    <div class="sw light" style="background:var(--amber-600)"><b>600</b><small>CC8500</small></div>
    <div class="sw light" style="background:var(--amber-700)"><b>700</b><small>946000</small></div>
  </div>
  <div class="cap"><b style="color:var(--text-strong)">--accent</b> = amber-400. Pairs warm with coral; never use as primary CTA fill.</div>
</body></html>
