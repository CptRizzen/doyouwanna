<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Mobile-first ramp, 11 → 58px. Display vs body roles." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px 22px;background:var(--surface-card);font-family:var(--font-sans)}
  .r{display:flex;align-items:baseline;gap:16px;padding:3px 0;border-bottom:1px solid var(--divider)}
  .r:last-child{border:0}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);width:96px;flex:none}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:42px;flex:none;text-align:right}
  .ex{color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d{font-family:var(--font-display);font-weight:600}
  .b{font-family:var(--font-sans);font-weight:500}
</style></head>
<body>
  <div class="r"><span class="tok">--text-5xl</span><span class="px">46</span><span class="ex d" style="font-size:40px">Wanna?</span></div>
  <div class="r"><span class="tok">--text-3xl</span><span class="px">30</span><span class="ex d" style="font-size:30px">Hiking crew</span></div>
  <div class="r"><span class="tok">--text-2xl</span><span class="px">24</span><span class="ex d" style="font-size:24px">Friday plans</span></div>
  <div class="r"><span class="tok">--text-xl</span><span class="px">20</span><span class="ex d" style="font-size:20px">Bar Trivia Gang</span></div>
  <div class="r"><span class="tok">--text-lg</span><span class="px">18</span><span class="ex b" style="font-size:18px">Section heading</span></div>
  <div class="r"><span class="tok">--text-base</span><span class="px">15</span><span class="ex b" style="font-size:15px;font-weight:400">Body copy — the default reading size</span></div>
  <div class="r"><span class="tok">--text-sm</span><span class="px">13</span><span class="ex b" style="font-size:13px;font-weight:600">LABELS / META</span></div>
  <div class="r"><span class="tok">--text-xs</span><span class="px">12</span><span class="ex b" style="font-size:12px;color:var(--text-muted)">timestamps · captions</span></div>
</body></html>
